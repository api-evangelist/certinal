aid: certinal

name: Certinal

description: Certinal provides a Healthcare Consent & Compliance Platform that digitizes consent capture, electronic signatures, and patient intake,
  integrating directly with EHR systems such as Epic, Cerner, MEDITECH, and OpenEMR. The platform is designed for healthcare organizations to
  meet regulatory requirements including HIPAA, 21 CFR Part 11, CMS‑0053‑F, DPDP, and PDPA, and to automate consent workflows across surgical,
  clinical trial, telehealth, and general treatment contexts.

